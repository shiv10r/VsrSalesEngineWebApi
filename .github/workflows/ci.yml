name: .NET CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore VsrSalesEngineWebApi.slnx

      - name: Build Solution
        run: dotnet build VsrSalesEngineWebApi.slnx --no-restore -c Release

      - name: Run Unit & Integration Tests
        run: dotnet test VsrSalesEngineWebApi.slnx --no-build -c Release --verbosity normal --logger "trx;LogFileName=test_results.trx"
