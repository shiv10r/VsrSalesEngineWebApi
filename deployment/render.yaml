services:
  # Web API + autonomous discovery worker (runs in the same process as a hosted background service).
  # A DB-backed distributed lock prevents duplicate discovery runs if this is ever scaled to multiple instances.
  - type: web
    name: vsr-sales-engine-webapi
    runtime: dotnet
    plan: starter
    region: oregon
    buildCommand: dotnet publish src/VsrSalesEngineWebApi/VsrSalesEngineWebApi.csproj -c Release -o out
    startCommand: dotnet out/VsrSalesEngineWebApi.dll
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AllowedOrigins
        value: https://vsrsalesengine.netlify.app
      - key: Jwt__Issuer
        value: VsrSalesEngineApi
      - key: Jwt__Audience
        value: VsrSalesEngineClients
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__SecretKey
        generateValue: true
      # First administrator. Production seeds NO demo users; without these two values nobody can sign in
      # (guest mode is also off). Choose a password of 12+ characters. Set in the Render dashboard, never in git.
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false
      # Shared secret for POST /api/agents/run-due. Copy the generated value into the
      # GitHub repository secret AGENT_RUN_KEY (and set API_BASE_URL) so the 2-hour timer can call it.
      - key: Agents__RunKey
        generateValue: true
